# Minimal stand-in for Supabase's API gateway (Kong) for local development:
#   /auth/v1/*  -> GoTrue
#   /rest/v1/*  -> PostgREST
# CORS is answered here, as Kong does in hosted Supabase, and the upstreams'
# own CORS headers are hidden to avoid duplicates.

map $http_origin $cors_origin {
  default $http_origin;
  ""      "*";
}

map $http_access_control_request_headers $cors_request_headers {
  default $http_access_control_request_headers;
  ""      "authorization, apikey, content-type, x-client-info, accept-profile, content-profile, prefer, range";
}

server {
  listen 8000;
  server_name _;
  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;

  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Expose-Headers "Content-Range, Content-Location, X-Supabase-Api-Version" always;
  add_header Vary Origin always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /auth/v1/ {
    include /etc/nginx/cors-preflight.conf;
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    include /etc/nginx/cors-preflight.conf;
    proxy_pass http://rest:3000/;
  }
}
