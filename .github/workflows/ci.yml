name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e-mock:
    name: E2E (mock backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        env:
          E2E_BACKEND: mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-mock
          path: apps/web/playwright-report
          retention-days: 7

  supabase:
    name: Supabase (RLS tests + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (Postgres, GoTrue, PostgREST, gateway) and apply migrations + seed
        run: docker compose up -d --wait db auth migrate rest gateway
      - name: RLS and database tests
        run: npm run test:db
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E against Supabase
        run: npm run test:e2e
        env:
          E2E_BACKEND: supabase
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color db auth migrate rest gateway
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-supabase
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
