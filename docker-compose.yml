# Local CodeSnip: a minimal self-hosted Supabase (Postgres + GoTrue + PostgREST
# behind an nginx gateway) plus the web app. One command:
#
#   docker compose up --build
#
#   web      http://localhost:3000
#   API      http://localhost:54321   (same URL + keys as `supabase start`)
#   Postgres postgres://postgres:postgres@localhost:54322/postgres
#
# Every value has a local default; override any of them in a .env file
# (see .env.example). The defaults are well-known development values: never
# reuse them for a deployed environment.

name: codesnip

x-db-url: &db-url postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres

services:
  db:
    image: supabase/postgres:17.6.1.136
    command:
      [
        'postgres',
        '-c',
        'config_file=/etc/postgresql/postgresql.conf',
        '-c',
        'log_min_messages=fatal',
      ]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    volumes:
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-54322}:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 3s
      timeout: 5s
      retries: 40

  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:54321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-http://localhost:3000/**,http://localhost:5173/**,http://localhost:4173/**}
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${API_EXTERNAL_URL:-http://localhost:54321}/auth/v1/callback
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 3s
      timeout: 5s
      retries: 40

  # One-shot: applies supabase/migrations + seed.sql once GoTrue has created
  # the auth schema (the migrations add triggers on auth.users).
  migrate:
    image: supabase/postgres:17.6.1.136
    depends_on:
      auth:
        condition: service_healthy
    entrypoint: ['bash', '/scripts/migrate.sh']
    environment:
      DATABASE_URL: *db-url
      SUPABASE_DIR: /supabase
      SEED: ${SEED:-true}
    volumes:
      - ./docker/migrate.sh:/scripts/migrate.sh:ro
      - ./supabase:/supabase:ro
    restart: 'no'

  rest:
    image: postgrest/postgrest:v14.17
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: ['CMD', 'postgrest', '--ready']
      interval: 3s
      timeout: 5s
      retries: 40

  gateway:
    image: nginx:1.29-alpine
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/gateway/cors-preflight.conf:/etc/nginx/cors-preflight.conf:ro
    ports:
      - '${API_PORT:-54321}:8000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8000/health']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  db-data:
