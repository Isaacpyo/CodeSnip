# Supabase CLI config. `npx supabase start` gives you the same local API URL
# (http://127.0.0.1:54321), database port and keys as `docker compose up`,
# applies ./migrations and runs ./seed.sql.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "codesnip"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

# Not used by CodeSnip.
[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:4173/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local only. Hosted projects should keep confirmations on.
enable_confirmations = false

# GitHub OAuth: set enabled = true and export GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET.
# Callback URL for the GitHub OAuth app: http://127.0.0.1:54321/auth/v1/callback
[auth.external.github]
enabled = false
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"
redirect_uri = ""
